<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" role="img" aria-labelledby="title desc">
  <title id="title">Eval 从发现案例到配对报告的完整流程</title>
  <desc id="desc">两个镜像发现相同案例后规划 case、variant、model、runNumber，写出 protocol 和 expected runs。每个任务启动新容器，隔离 HOME、AgentDir 和 Workspace；Agent 执行 prompt 与 reload，读取实际产物评分并保存 Vitest JSON 和 Session。结果归一化后检查两组各有且仅有一个有效 score；满足则计算成功率、成本和延迟差值，不满足则标记 blocked pair，并阻止该 eval set 发布 headline lift。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/></marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#0f766e"/></marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#b45309"/></marker>
    <style>text { font-family: system-ui, -apple-system, Segoe UI, Microsoft YaHei, Noto Sans CJK SC, sans-serif; }</style>
  </defs>
  <rect width="1200" height="1600" fill="#f8fafc"/>
  <text x="56" y="78" font-size="30" font-weight="700" fill="#0f172a">Eval 怎样从运行走到可比较的报告？</text>
  <text x="56" y="116" font-size="20" fill="#475569">计划、执行、评分、归档、配对逐步核对；不完整的配对会阻止 headline lift。</text>

  <rect x="220" y="154" width="760" height="82" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <circle cx="260" cy="195" r="20" fill="#2563eb"/><text x="254" y="202" font-size="19" font-weight="700" fill="#ffffff">1</text>
  <text x="296" y="190" font-size="21" font-weight="700" fill="#0f172a">发现两份镜像中的相同案例</text>
  <text x="296" y="220" font-size="18" fill="#475569">核对案例集合一致</text>
  <path d="M600 238 V264" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>

  <rect x="220" y="272" width="760" height="82" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <circle cx="260" cy="313" r="20" fill="#2563eb"/><text x="254" y="320" font-size="19" font-weight="700" fill="#ffffff">2</text>
  <text x="296" y="308" font-size="21" font-weight="700" fill="#0f172a">规划 case × variant × model × runNumber</text>
  <text x="296" y="338" font-size="18" fill="#475569">明确每个条件的预期运行项</text>
  <path d="M600 356 V382" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>

  <rect x="220" y="390" width="760" height="82" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <circle cx="260" cy="431" r="20" fill="#2563eb"/><text x="254" y="438" font-size="19" font-weight="700" fill="#ffffff">3</text>
  <text x="296" y="426" font-size="21" font-weight="700" fill="#0f172a">写入 protocol 与 expected runs</text>
  <text x="296" y="456" font-size="18" fill="#475569">保留计划身份与协议摘要</text>
  <path d="M600 474 V500" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>

  <rect x="220" y="508" width="760" height="82" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <circle cx="260" cy="549" r="20" fill="#2563eb"/><text x="254" y="556" font-size="19" font-weight="700" fill="#ffffff">4</text>
  <text x="296" y="544" font-size="21" font-weight="700" fill="#0f172a">每个任务启动一个新容器</text>
  <text x="296" y="574" font-size="18" fill="#475569">按案例过滤运行</text>
  <path d="M600 592 V618" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>

  <rect x="220" y="626" width="760" height="82" rx="16" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
  <circle cx="260" cy="667" r="20" fill="#b45309"/><text x="254" y="674" font-size="19" font-weight="700" fill="#ffffff">5</text>
  <text x="296" y="662" font-size="21" font-weight="700" fill="#0f172a">隔离 HOME、AgentDir、Workspace</text>
  <text x="296" y="692" font-size="18" fill="#475569">只读根文件系统、临时目录与独立 artifacts</text>
  <path d="M600 710 V736" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>

  <rect x="220" y="744" width="760" height="82" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <circle cx="260" cy="785" r="20" fill="#2563eb"/><text x="254" y="792" font-size="19" font-weight="700" fill="#ffffff">6</text>
  <text x="296" y="780" font-size="21" font-weight="700" fill="#0f172a">Agent 执行 prompt 与 reload</text>
  <text x="296" y="810" font-size="18" fill="#475569">harness 在隔离环境内运行任务</text>
  <path d="M600 828 V854" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>

  <rect x="220" y="862" width="760" height="82" rx="16" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
  <circle cx="260" cy="903" r="20" fill="#0f766e"/><text x="254" y="910" font-size="19" font-weight="700" fill="#ffffff">7</text>
  <text x="296" y="898" font-size="21" font-weight="700" fill="#0f172a">读取实际结果并评分</text>
  <text x="296" y="928" font-size="18" fill="#475569">依据任务产物，不按 Agent 回复措辞评分</text>
  <path d="M600 946 V972" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>

  <rect x="220" y="980" width="760" height="82" rx="16" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <circle cx="260" cy="1021" r="20" fill="#7c3aed"/><text x="254" y="1028" font-size="19" font-weight="700" fill="#ffffff">8</text>
  <text x="296" y="1016" font-size="21" font-weight="700" fill="#0f172a">保存 Vitest JSON 与原生 Session</text>
  <text x="296" y="1046" font-size="18" fill="#475569">Session 留档用于诊断与复核</text>
  <path d="M600 1064 V1090" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>

  <rect x="220" y="1098" width="760" height="82" rx="16" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <circle cx="260" cy="1139" r="20" fill="#7c3aed"/><text x="254" y="1146" font-size="19" font-weight="700" fill="#ffffff">9</text>
  <text x="296" y="1134" font-size="21" font-weight="700" fill="#0f172a">归一化 observation</text>
  <text x="296" y="1164" font-size="18" fill="#475569">核对身份、唯一性、metrics 与评分状态</text>
  <path d="M600 1182 V1208" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>

  <path d="M600 1216 L770 1290 L600 1364 L430 1290 Z" fill="#fffbeb" stroke="#b45309" stroke-width="2.5"/>
  <text x="492" y="1282" font-size="20" font-weight="700" fill="#0f172a">两组是否各有且仅有</text>
  <text x="517" y="1312" font-size="20" font-weight="700" fill="#0f172a">一个有效 score？</text>
  <path d="M432 1290 H320 V1390" stroke="#0f766e" stroke-width="2.5" fill="none" marker-end="url(#arrow-green)"/>
  <text x="342" y="1276" font-size="18" fill="#0f766e">是</text>
  <rect x="88" y="1398" width="464" height="96" rx="16" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
  <text x="116" y="1440" font-size="20" font-weight="700" fill="#0f172a">计算成功率与成本 / 延迟差值</text>
  <text x="116" y="1474" font-size="18" fill="#475569">成功率按 score ≥ 1 判断通过</text>

  <path d="M768 1290 H872 V1390" stroke="#b45309" stroke-width="2.5" fill="none" marker-end="url(#arrow-orange)"/>
  <text x="794" y="1276" font-size="18" fill="#b45309">否</text>
  <rect x="640" y="1398" width="464" height="64" rx="16" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
  <text x="668" y="1438" font-size="20" font-weight="700" fill="#0f172a">标记 blocked pair</text>
  <path d="M872 1464 V1482" stroke="#b45309" stroke-width="2.5" fill="none" marker-end="url(#arrow-orange)"/>
  <rect x="640" y="1490" width="464" height="58" rx="14" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
  <text x="660" y="1527" font-size="19" font-weight="700" fill="#0f172a">该 eval set 不发布 headline lift</text>
</svg>
