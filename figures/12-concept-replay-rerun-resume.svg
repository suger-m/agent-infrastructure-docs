<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">回放、真实重新运行与恢复执行的输入边界</title>
  <desc id="desc">通用教学比较三种方式：Replay 从录制的模型和工具输入重放，须重建副作用；Live rerun 从初始 fixture 再调用外部服务，输出可能变化；Resume 从检查点和已有状态继续同一任务，目标是交付而非重复实验。</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#526579"/></marker></defs><rect width="1200" height="760" fill="#f5f8fc"/>
  <style>.title{font:700 28px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#14283f}.label{font:600 19px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#18324d}.small{font:17px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#526579}.node{fill:#fff;stroke:#9db0c4;stroke-width:2}.blue{fill:#e7f1ff;stroke:#5b8cc9}.green{fill:#e6f5ee;stroke:#4c9b72}.amber{fill:#fff2d9;stroke:#c58a2b}.line{fill:none;stroke:#526579;stroke-width:2.5;marker-end:url(#arrow)}</style>
  <text x="48" y="58" class="title">按问题选择重放、重跑或恢复</text><text x="50" y="104" class="small">通用教学对照 · 三种方式从不同输入边界开始，输出含义也不同</text>
  <rect x="55" y="155" width="340" height="455" rx="20" fill="#edf4fb" stroke="#9db0c4" stroke-width="2"/><text x="225" y="198" text-anchor="middle" class="label">Replay · 固定历史输入</text>
  <rect x="90" y="235" width="270" height="78" rx="14" class="node blue"/><text x="225" y="268" text-anchor="middle" class="label">请求 / 响应录制</text><text x="225" y="295" text-anchor="middle" class="small">工具参数与返回值</text>
  <rect x="90" y="360" width="270" height="78" rx="14" class="node amber"/><text x="225" y="393" text-anchor="middle" class="label">注入固定结果</text><text x="225" y="420" text-anchor="middle" class="small">不匹配时报差异</text>
  <rect x="90" y="485" width="270" height="78" rx="14" class="node green"/><text x="225" y="518" text-anchor="middle" class="label">检查程序新行为</text><text x="225" y="545" text-anchor="middle" class="small">需恢复文件等副作用</text>
  <path d="M225 313V354" class="line"/><path d="M225 438V479" class="line"/>
  <rect x="430" y="155" width="340" height="455" rx="20" fill="#edf4fb" stroke="#9db0c4" stroke-width="2"/><text x="600" y="198" text-anchor="middle" class="label">Live rerun · 从头再测</text>
  <rect x="465" y="235" width="270" height="78" rx="14" class="node blue"/><text x="600" y="268" text-anchor="middle" class="label">初始 Fixture</text><text x="600" y="295" text-anchor="middle" class="small">版本与环境记录</text>
  <rect x="465" y="360" width="270" height="78" rx="14" class="node amber"/><text x="600" y="393" text-anchor="middle" class="label">重新请求模型与工具</text><text x="600" y="420" text-anchor="middle" class="small">外部状态可能已改变</text>
  <rect x="465" y="485" width="270" height="78" rx="14" class="node green"/><text x="600" y="518" text-anchor="middle" class="label">新的观测结果</text><text x="600" y="545" text-anchor="middle" class="small">适合测当前版本表现</text>
  <path d="M600 313V354" class="line"/><path d="M600 438V479" class="line"/>
  <rect x="805" y="155" width="340" height="455" rx="20" fill="#edf4fb" stroke="#9db0c4" stroke-width="2"/><text x="975" y="198" text-anchor="middle" class="label">Resume · 继续同一任务</text>
  <rect x="840" y="235" width="270" height="78" rx="14" class="node blue"/><text x="975" y="268" text-anchor="middle" class="label">檢查點與外部狀態</text><text x="975" y="295" text-anchor="middle" class="small">完成 / 未知步骤</text>
  <rect x="840" y="360" width="270" height="78" rx="14" class="node amber"/><text x="975" y="393" text-anchor="middle" class="label">判断安全续接位置</text><text x="975" y="420" text-anchor="middle" class="small">处理不确定副作用</text>
  <rect x="840" y="485" width="270" height="78" rx="14" class="node green"/><text x="975" y="518" text-anchor="middle" class="label">继续交付原任务</text><text x="975" y="545" text-anchor="middle" class="small">不等于新的实验运行</text>
  <path d="M975 313V354" class="line"/><path d="M975 438V479" class="line"/>
  <text x="55" y="675" class="small">回放固定边界输入；重跑产生新外部调用；恢复从检查点续接。Session 对话可读不代表外部状态已恢复。</text>
</svg>
