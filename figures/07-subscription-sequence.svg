<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1300" viewBox="0 0 1200 1300" role="img" aria-labelledby="title desc">
  <title id="title">Chord 客户端订阅快照与增量的时序</title>
  <desc id="desc">完整展示 Durable Session、Chord provider、Remote consumer 与 UI subscription 四个参与者的原始时序：存储提交后 adopt/publish，发送权威状态与操作；客户端订阅并取得序号10快照；序号11发布时先缓冲；副本先 hydration 再 activate，随后解码校验并应用更新，最后向 UI 发布完整值。断线、换代或显式 reset 后需重建基线。</desc>
  <rect width="1200" height="1300" fill="#f8fafc"/>
  <text x="52" y="62" fill="#0f172a" font-family="system-ui, -apple-system, Segoe UI, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="30" font-weight="700">订阅竞争：先装快照，再接续增量</text>
  <text x="52" y="98" fill="#475569" font-family="system-ui, -apple-system, Segoe UI, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20">快照与后续发布按同一状态成员的序号衔接；本图沿用 10 与 11。</text>

  <rect x="54" y="154" width="192" height="64" rx="14" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="150" y="179" text-anchor="middle" fill="#0f172a" font-family="system-ui, -apple-system, Segoe UI, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="700"><tspan x="150">Durable</tspan><tspan x="150" dy="23">Session</tspan></text>
  <rect x="352" y="154" width="196" height="64" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
  <text x="450" y="179" text-anchor="middle" fill="#0f172a" font-family="system-ui, -apple-system, Segoe UI, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="700"><tspan x="450">Chord</tspan><tspan x="450" dy="23">provider</tspan></text>
  <rect x="652" y="154" width="196" height="64" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="750" y="179" text-anchor="middle" fill="#0f172a" font-family="system-ui, -apple-system, Segoe UI, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="700"><tspan x="750">Remote</tspan><tspan x="750" dy="23">consumer</tspan></text>
  <rect x="952" y="154" width="196" height="64" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="1050" y="179" text-anchor="middle" fill="#0f172a" font-family="system-ui, -apple-system, Segoe UI, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="700"><tspan x="1050">UI</tspan><tspan x="1050" dy="23">subscription</tspan></text>

  <path d="M150 218 V1088 M450 218 V1088 M750 218 V1088 M1050 218 V1088" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 7"/>
  <rect x="48" y="232" width="1104" height="74" fill="#f5f3ff"/>
  <rect x="48" y="306" width="1104" height="74" fill="#ffffff"/>
  <rect x="48" y="380" width="1104" height="74" fill="#eff6ff"/>
  <rect x="48" y="454" width="1104" height="74" fill="#ffffff"/>
  <rect x="48" y="528" width="1104" height="74" fill="#f5f3ff"/>
  <rect x="48" y="602" width="1104" height="74" fill="#fffbeb"/>
