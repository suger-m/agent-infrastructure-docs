  <rect x="48" y="750" width="1104" height="74" fill="#ffffff"/>
  <rect x="48" y="824" width="1104" height="74" fill="#f0fdfa"/>
  <rect x="48" y="898" width="1104" height="74" fill="#ffffff"/>
  <rect x="48" y="972" width="1104" height="74" fill="#f5f3ff"/>

  <rect x="82" y="238" width="236" height="48" rx="10" fill="#f8fafc"/>
  <text x="200" y="258" text-anchor="middle" fill="#0f172a" font-family="system-ui, -apple-system, Segoe UI, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18"><tspan x="200">Storage commit 后</tspan><tspan x="200" dy="22">adopt / publish</tspan></text>
  <path d="M150 304 h48 v-10 h-48" fill="none" stroke="#7c3aed" stroke-width="2.5"/><path d="M150 294 l10 -7 v14 z" fill="#7c3aed"/>

  <rect x="234" y="312" width="332" height="48" rx="10" fill="#f8fafc"/>
  <text x="400" y="332" text-anchor="middle" fill="#0f172a" font-family="system-ui, -apple-system, Segoe UI, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18"><tspan x="400">权威 value</tspan><tspan x="400" dy="22">与 exact ops</tspan></text>
  <path d="M150 372 H450" fill="none" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="8 7"/><path d="M450 372 l-12 -7 v14 z" fill="#7c3aed"/>

  <rect x="534" y="386" width="332" height="48" rx="10" fill="#f8fafc"/>
  <text x="700" y="416" text-anchor="middle" fill="#0f172a" font-family="system-ui, -apple-system, Segoe UI, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18">subscribe</text>
  <path d="M750 446 H450" fill="none" stroke="#2563eb" stroke-width="2.5"/><path d="M450 446 l12 -7 v14 z" fill="#2563eb"/>

  <rect x="534" y="460" width="332" height="48" rx="10" fill="#f8fafc"/>
  <text x="700" y="480" text-anchor="middle" fill="#0f172a" font-family="system-ui, -apple-system, Segoe UI, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18"><tspan x="700">snapshot 与</tspan><tspan x="700" dy="22">sequence 10</tspan></text>
  <path d="M450 520 H750" fill="none" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="8 7"/><path d="M750 520 l-12 -7 v14 z" fill="#7c3aed"/>

  <rect x="234" y="534" width="332" height="48" rx="10" fill="#f8fafc"/>
  <text x="400" y="554" text-anchor="middle" fill="#0f172a" font-family="system-ui, -apple-system, Segoe UI, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18"><tspan x="400">sequence 11</tspan><tspan x="400" dy="22">的变化</tspan></text>
  <path d="M150 594 H450" fill="none" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="8 7"/><path d="M450 594 l-12 -7 v14 z" fill="#7c3aed"/>

  <rect x="434" y="608" width="232" height="48" rx="10" fill="#fffbeb"/>
  <text x="550" y="638" text-anchor="middle" fill="#92400e" font-family="system-ui, -apple-system, Segoe UI, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18">buffer update 11</text>
  <path d="M450 674 h46 v-10 h-46" fill="none" stroke="#b45309" stroke-width="2.5"/><path d="M450 664 l10 -7 v14 z" fill="#b45309"/>

