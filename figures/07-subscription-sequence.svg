  <text x="750" y="702" text-anchor="middle" fill="#0f172a" font-family="system-ui, -apple-system, Segoe UI, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18"><tspan x="750">hydrate</tspan><tspan x="750" dy="22">snapshot 10</tspan></text>
  <path d="M750 748 h46 v-10 h-46" fill="none" stroke="#2563eb" stroke-width="2.5"/><path d="M750 738 l10 -7 v14 z" fill="#2563eb"/>

  <rect x="634" y="756" width="232" height="48" rx="10" fill="#f8fafc"/>
  <text x="750" y="786" text-anchor="middle" fill="#0f172a" font-family="system-ui, -apple-system, Segoe UI, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18">activate</text>
  <path d="M750 816 H450" fill="none" stroke="#2563eb" stroke-width="2.5"/><path d="M450 816 l12 -7 v14 z" fill="#2563eb"/>

  <rect x="534" y="830" width="332" height="48" rx="10" fill="#f8fafc"/>
  <text x="700" y="850" text-anchor="middle" fill="#0f172a" font-family="system-ui, -apple-system, Segoe UI, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18"><tspan x="700">update</tspan><tspan x="700" dy="22">11</tspan></text>
  <path d="M450 890 H750" fill="none" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="8 7"/><path d="M750 890 l-12 -7 v14 z" fill="#7c3aed"/>

  <rect x="634" y="904" width="232" height="48" rx="10" fill="#f8fafc"/>
  <text x="750" y="924" text-anchor="middle" fill="#0f172a" font-family="system-ui, -apple-system, Segoe UI, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18"><tspan x="750">decode + validate</tspan><tspan x="750" dy="22">+ apply</tspan></text>
  <path d="M750 970 h46 v-10 h-46" fill="none" stroke="#2563eb" stroke-width="2.5"/><path d="M750 960 l10 -7 v14 z" fill="#2563eb"/>

  <rect x="784" y="978" width="266" height="48" rx="10" fill="#f8fafc"/>
  <text x="917" y="998" text-anchor="middle" fill="#0f172a" font-family="system-ui, -apple-system, Segoe UI, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18"><tspan x="917">完整 immutable</tspan><tspan x="917" dy="22">value 11</tspan></text>
  <path d="M750 1040 H1050" fill="none" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="8 7"/><path d="M1050 1040 l-12 -7 v14 z" fill="#7c3aed"/>

  <rect x="160" y="1120" width="880" height="100" rx="16" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  <text x="188" y="1156" fill="#0f172a" font-family="system-ui, -apple-system, Segoe UI, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="700">断线、换代或显式 reset：重新建立基线</text>
  <text x="188" y="1190" fill="#475569" font-family="system-ui, -apple-system, Segoe UI, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18">副本先安装新的完整快照，再接续后续序号；普通 update 必须连续，缺号时不能拿它代替 reset。</text>
</svg>
