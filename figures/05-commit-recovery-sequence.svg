  <rect x="355" y="412" width="210" height="46" rx="10" fill="#f8fafc"/>
  <text x="460" y="442" text-anchor="middle" fill="#0f172a" font-family="system-ui, -apple-system, Segoe UI, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18">commit sequence</text>
  <path d="M580 466 H340" fill="none" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="8 7"/><path d="M340 466 l12 -7 v14 z" fill="#7c3aed"/>

