<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1460" viewBox="0 0 1200 1460" role="img" aria-labelledby="title desc">
  <title id="title">自定义持久任务的提交与崩溃恢复时序</title>
  <desc id="desc">保留原始五个参与者和完整时序：保存 apply checkpoint 与稳定 key、原子提交、adopt、publish、调用外部服务、崩溃窗口、重开后使用同一 key 再次调用、保存 terminal outcome 并发布。外部幂等去重是自定义任务与外部服务的约定，不代表内建 unsafe 工具会自动重放。</desc>
  <rect width="1200" height="1460" fill="#f8fafc"/>
  <text x="52" y="62" fill="#0f172a" font-family="system-ui, -apple-system, Segoe UI, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="30" font-weight="700">提交、外部操作与重开后的恢复时序</text>
  <text x="52" y="98" fill="#475569" font-family="system-ui, -apple-system, Segoe UI, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20">自定义任务先保存 apply 意图，执行外部操作，再保存 terminal outcome。</text>
  <rect x="52" y="116" width="1096" height="58" rx="14" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  <text x="74" y="141" fill="#0f172a" font-family="system-ui, -apple-system, Segoe UI, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18">
    <tspan x="74">同 key 的外部去重依赖这类自定义任务与外部服务的约定；</tspan><tspan x="74" dy="23">它不是内建工具 unsafe 策略下的自动重放保证。</tspan>
  </text>

  <rect x="48" y="190" width="104" height="62" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="100" y="216" text-anchor="middle" fill="#0f172a" font-family="system-ui, -apple-system, Segoe UI, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="700"><tspan x="100">Task</tspan><tspan x="100" dy="22">handler</tspan></text>
  <rect x="228" y="190" width="224" height="62" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="340" y="216" text-anchor="middle" fill="#0f172a" font-family="system-ui, -apple-system, Segoe UI, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="700"><tspan x="340">Session</tspan><tspan x="340" dy="22">mutation line</tspan></text>
  <rect x="532" y="190" width="96" height="62" rx="14" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="580" y="228" text-anchor="middle" fill="#0f172a" font-family="system-ui, -apple-system, Segoe UI, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="700">Storage</text>
  <rect x="716" y="190" width="208" height="62" rx="14" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
  <text x="820" y="216" text-anchor="middle" fill="#0f172a" font-family="system-ui, -apple-system, Segoe UI, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="700"><tspan x="820">External</tspan><tspan x="820" dy="22">service</tspan></text>
  <rect x="960" y="190" width="200" height="62" rx="14" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="1060" y="216" text-anchor="middle" fill="#0f172a" font-family="system-ui, -apple-system, Segoe UI, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="700"><tspan x="1060">View /</tspan><tspan x="1060" dy="22">observer</tspan></text>

