  <text x="344" y="812" text-anchor="middle" fill="#92400e" font-family="system-ui, -apple-system, Segoe UI, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="700">此处进程崩溃：receipt 尚未持久化</text>

  <rect x="110" y="854" width="230" height="46" rx="10" fill="#f8fafc"/>
  <text x="225" y="874" text-anchor="middle" fill="#0f172a" font-family="system-ui, -apple-system, Segoe UI, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18"><tspan x="225">重开并从</tspan><tspan x="225" dy="21">apply 继续</tspan></text>
  <path d="M100 908 H340" fill="none" stroke="#2563eb" stroke-width="2.5"/><path d="M340 908 l-12 -7 v14 z" fill="#2563eb"/>

