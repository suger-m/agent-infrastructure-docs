<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">任务所有权与显式等待关系</title>
  <desc id="desc">完整展示 Root conversation 拥有 Checkout task 和 Background anchor；Checkout 拥有 Payment A、Payment B 和 Child conversation，并通过 waiting.on 与 failFast 显式等待两笔 Payment；子会话、子 generation、后台 child conversation 与后台 child generation 的所有权链。</desc>
  <rect width="1200" height="900" fill="#f8fafc"/>
  <text x="52" y="66" fill="#0f172a" font-family="system-ui, -apple-system, Segoe UI, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="30" font-weight="700">任务图：所有权决定收尾范围，等待边只表示 join</text>
  <text x="52" y="104" fill="#475569" font-family="system-ui, -apple-system, Segoe UI, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20">实线是拥有关系；虚线是显式等待。后台 anchor 归 Root conversation 所有。</text>

