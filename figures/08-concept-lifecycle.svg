<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">执行环境从准备到清理的完整生命周期</title><desc id="desc">监督者准备隔离配置，运行并监控任务，终止全部进程后取回产物，再清理环境。宿主可写挂载会保留已写入的变化，不会随销毁回滚。</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#526579"/></marker></defs><rect width="1200" height="680" fill="#f5f8fc"/>
  <style>.title{font:700 28px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#14283f}.label{font:600 19px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#18324d}.small{font:17px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#526579}.node{fill:#fff;stroke:#9db0c4;stroke-width:2}.blue{fill:#e7f1ff;stroke:#5b8cc9}.green{fill:#e6f5ee;stroke:#4c9b72}.amber{fill:#fff2d9;stroke:#c58a2b}.red{fill:#fde9e7;stroke:#c86c61}.line{fill:none;stroke:#526579;stroke-width:2.5;marker-end:url(#arrow)}.dash{fill:none;stroke:#bd665b;stroke-width:2.5;stroke-dasharray:8 7;marker-end:url(#arrow)}</style>
  <text x="48" y="58" class="title">监督者贯穿准备、运行、停止、取回与清理</text><text x="50" y="98" class="small">通用教学模型 · 宿主可写挂载上的写入不会因环境销毁而回滚</text>
  <rect x="55" y="165" width="200" height="105" rx="16" class="node blue"/><text x="155" y="205" text-anchor="middle" class="label">准备环境</text><text x="155" y="235" text-anchor="middle" class="small">输入、权限、配额</text>
  <rect x="330" y="165" width="200" height="105" rx="16" class="node blue"/><text x="430" y="205" text-anchor="middle" class="label">运行并监控</text><text x="430" y="235" text-anchor="middle" class="small">输出、状态、资源</text>
  <rect x="605" y="165" width="200" height="105" rx="16" class="node amber"/><text x="705" y="205" text-anchor="middle" class="label">停止并确认退出</text><text x="705" y="235" text-anchor="middle" class="small">包含所有后代进程</text>
  <rect x="880" y="165" width="200" height="105" rx="16" class="node green"/><text x="980" y="205" text-anchor="middle" class="label">取回产物</text><text x="980" y="235" text-anchor="middle" class="small">核验差异与证据</text>
  <path d="M255 218H325" class="line"/><path d="M530 218H600" class="line"/><path d="M805 218H875" class="line"/>
  <rect x="880" y="390" width="200" height="100" rx="16" class="node blue"/><text x="980" y="430" text-anchor="middle" class="label">清理环境</text><text x="980" y="460" text-anchor="middle" class="small">撤凭证、删挂载与临时区</text><path d="M980 270V385" class="line"/>
  <rect x="385" y="390" width="360" height="100" rx="16" class="node red"/><text x="565" y="430" text-anchor="middle" class="label">宿主可写挂载</text><text x="565" y="460" text-anchor="middle" class="small">运行时已写入宿主；销毁不会回滚</text><path d="M430 270V335H565V385" class="dash"/><text x="445" y="320" class="small">文件写入</text>
  <rect x="55" y="390" width="250" height="100" rx="16" class="node amber"/><text x="180" y="430" text-anchor="middle" class="label">独立副本的写回</text><text x="180" y="460" text-anchor="middle" class="small">审查后再决定是否写回</text>
  <path d="M980 270V340H180V385" class="line"/><text x="580" y="365" text-anchor="middle" class="small">使用独立副本时，产物先核验，再单独提交</text>
  <rect x="55" y="575" width="1090" height="55" rx="14" fill="#edf2f7" stroke="#d5dee8"/><text x="600" y="610" text-anchor="middle" class="small">结果通知丢失时先按任务标识核查；直接重跑可能重复副作用。</text>
</svg>
