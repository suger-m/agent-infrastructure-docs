<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">秘密按需获取、注入与退出的生命周期</title>
  <desc id="desc">通用教学生命周期从用户授权和秘密存储开始。调用者获准后短暂注入必要秘密；到期可刷新，轮换替换旧凭据，撤销使授权失效，最后清理临时副本。</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#526579"/></marker></defs><rect width="1200" height="760" fill="#f5f8fc"/>
  <style>.title{font:700 28px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#14283f}.label{font:600 19px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#18324d}.small{font:17px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#526579}.node{fill:#fff;stroke:#9db0c4;stroke-width:2}.blue{fill:#e7f1ff;stroke:#5b8cc9}.green{fill:#e6f5ee;stroke:#4c9b72}.amber{fill:#fff2d9;stroke:#c58a2b}.red{fill:#fff0ef;stroke:#c66a62}.line{fill:none;stroke:#526579;stroke-width:2.5;marker-end:url(#arrow)}</style>
  <text x="48" y="58" class="title">秘密只在需要时进入调用组件</text><text x="50" y="104" class="small">通用教学生命周期 · 存储权限、调用授权与服务端撤销是不同控制</text>
  <rect x="55" y="180" width="205" height="100" rx="16" class="node blue"/><text x="157" y="220" text-anchor="middle" class="label">取得凭据</text><text x="157" y="250" text-anchor="middle" class="small">用户同意 / 配置 Key</text>
  <rect x="340" y="180" width="205" height="100" rx="16" class="node blue"/><text x="442" y="220" text-anchor="middle" class="label">受保护存储</text><text x="442" y="250" text-anchor="middle" class="small">服务 · 账号 · 到期</text>
  <rect x="625" y="180" width="205" height="100" rx="16" class="node amber"/><text x="727" y="220" text-anchor="middle" class="label">按需授权读取</text><text x="727" y="250" text-anchor="middle" class="small">核对调用者与范围</text>
  <rect x="910" y="180" width="235" height="100" rx="16" class="node green"/><text x="1027" y="220" text-anchor="middle" class="label">最小注入</text><text x="1027" y="250" text-anchor="middle" class="small">只交给发请求的组件</text>
  <rect x="910" y="390" width="235" height="100" rx="16" class="node blue"/><text x="1027" y="430" text-anchor="middle" class="label">服务调用</text><text x="1027" y="460" text-anchor="middle" class="small">不进入提示词或日志</text>
  <rect x="625" y="390" width="205" height="100" rx="16" class="node amber"/><text x="727" y="430" text-anchor="middle" class="label">刷新 / 轮换</text><text x="727" y="460" text-anchor="middle" class="small">协调并保存新版本</text>
  <rect x="340" y="390" width="205" height="100" rx="16" class="node red"/><text x="442" y="430" text-anchor="middle" class="label">撤销 / 到期</text><text x="442" y="460" text-anchor="middle" class="small">停止使用，必要时重登</text>
  <rect x="55" y="390" width="205" height="100" rx="16" class="node blue"/><text x="157" y="430" text-anchor="middle" class="label">清理临时副本</text><text x="157" y="460" text-anchor="middle" class="small">退出、取消、异常后</text>
  <path d="M260 230H334" class="line"/><path d="M545 230H619" class="line"/><path d="M830 230H904" class="line"/><path d="M1027 282V384" class="line"/><path d="M910 440H836" class="line" stroke-dasharray="8 7"/><path d="M625 440H551" class="line" stroke-dasharray="8 7"/><path d="M340 440H266" class="line"/>
  <text x="847" y="426" class="small">将到期</text><text x="567" y="426" class="small">失效</text>
  <path d="M1027 495V540H157V495" class="line"/>
  <text x="635" y="528" class="small">本次调用结束，清理临时副本</text>
  <path d="M727 384V315H442V286" class="line"/><text x="747" y="335" class="small">新版本回存</text>
  <rect x="340" y="565" width="490" height="82" rx="16" fill="#edf2f7" stroke="#d5dee8"/><text x="585" y="599" text-anchor="middle" class="label">删除本地副本 ≠ 服务端撤销</text><text x="585" y="628" text-anchor="middle" class="small">泄漏凭据还需在签发服务撤销或替换</text>
</svg>
