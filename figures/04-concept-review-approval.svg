<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">审阅与人工批准绑定产物版本</title><desc id="desc">审阅通过针对一个固定补丁版本；批准请求展示该版本和动作。若等待期间产物改变，旧批准不适用于新版本，需重新审阅并请求决定。</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#526579"/></marker></defs><rect width="1200" height="760" fill="#f5f8fc"/>
  <style>.title{font:700 28px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#14283f}.label{font:600 19px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#18324d}.small{font:17px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#526579}.node{fill:#fff;stroke:#9db0c4;stroke-width:2}.blue{fill:#e7f1ff;stroke:#5b8cc9}.green{fill:#e6f5ee;stroke:#4c9b72}.amber{fill:#fff2d9;stroke:#c58a2b}.line{fill:none;stroke:#526579;stroke-width:2.5;marker-end:url(#arrow)}.dash{fill:none;stroke:#c58a2b;stroke-width:2.5;stroke-dasharray:8 7;marker-end:url(#arrow)}</style>
  <text x="48" y="58" class="title">批准针对看过的版本与动作</text><text x="50" y="104" class="small">通用审批教学图 · Pi 示例没有通用审批记录或审批队列</text>
  <rect x="55" y="230" width="205" height="115" rx="16" class="node blue"/><text x="157" y="272" text-anchor="middle" class="label">候审产物 v1</text><text x="157" y="303" text-anchor="middle" class="small">补丁摘要 + 校验结果</text>
  <rect x="355" y="230" width="205" height="115" rx="16" class="node green"/><text x="457" y="272" text-anchor="middle" class="label">独立审阅</text><text x="457" y="303" text-anchor="middle" class="small">结论：通过 v1</text>
  <rect x="655" y="230" width="220" height="115" rx="16" class="node amber"/><text x="765" y="272" text-anchor="middle" class="label">等待用户决定</text><text x="765" y="303" text-anchor="middle" class="small">发布动作 + 目标环境</text>
  <rect x="955" y="150" width="190" height="95" rx="16" class="node green"/><text x="1050" y="190" text-anchor="middle" class="label">批准 v1</text><text x="1050" y="220" text-anchor="middle" class="small">执行约定动作</text>
  <rect x="955" y="340" width="190" height="95" rx="16" class="node"/><text x="1050" y="380" text-anchor="middle" class="label">拒绝</text><text x="1050" y="410" text-anchor="middle" class="small">结束发布路径</text>
  <rect x="655" y="500" width="220" height="105" rx="16" class="node blue"/><text x="765" y="542" text-anchor="middle" class="label">修订产物 v2</text><text x="765" y="573" text-anchor="middle" class="small">版本变化使旧结论过期</text>
  <rect x="355" y="500" width="205" height="105" rx="16" class="node amber"/><text x="457" y="542" text-anchor="middle" class="label">重新审阅</text><text x="457" y="573" text-anchor="middle" class="small">再请求批准 v2</text>
  <path d="M260 287H350" class="line"/><path d="M560 287H650" class="line"/><path d="M875 265L950 205" class="line"/><path d="M875 310L950 385" class="line"/><path d="M765 350V495" class="dash"/><path d="M655 552H565" class="dash"/><path d="M457 495V455H765V350" class="line"/><text x="801" y="454" class="small">发生变更</text>
  <rect x="55" y="635" width="1090" height="54" rx="14" fill="#edf2f7"/><text x="78" y="670" class="small">把版本、动作、环境与检查证据一起展示；批准范围与后续执行逐项核对。</text>
</svg>
