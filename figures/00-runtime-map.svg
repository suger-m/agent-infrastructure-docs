<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1000" viewBox="0 0 1200 1000" role="img" aria-labelledby="title desc">
  <title id="title">Pi Agent Infra 默认与实验运行路径</title>
  <desc id="desc">完整展示默认 CLI 与 SDK 路径、实验 durable 路径、两条路径共用的 pi-ai、工具与外部服务，以及 Session、Storage、Chord、durable 任务与执行环境之间的关系。</desc>
