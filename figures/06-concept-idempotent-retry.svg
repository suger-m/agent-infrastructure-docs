<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">稳定幂等键让创建工单的重试复用原结果</title><desc id="desc">调用方先固定业务键和参数；首次创建成功但响应丢失时，重试仍用相同键。服务查到已完成记录便返回原工单号，不再创建第二张。</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#526579"/></marker></defs><rect width="1200" height="760" fill="#f5f8fc"/>
  <style>.title{font:700 28px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#14283f}.label{font:600 19px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#18324d}.small{font:17px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#526579}.node{fill:#fff;stroke:#9db0c4;stroke-width:2}.blue{fill:#e7f1ff;stroke:#5b8cc9}.green{fill:#e6f5ee;stroke:#4c9b72}.amber{fill:#fff2d9;stroke:#c58a2b}.line{fill:none;stroke:#526579;stroke-width:2.5;marker-end:url(#arrow)}</style>
  <text x="48" y="58" class="title">重试同一业务操作，复用服务端结果</text><text x="50" y="104" class="small">通用服务协议教学图 · 只有参与幂等协议的范围获得去重保证</text>
  <rect x="55" y="220" width="220" height="110" rx="16" class="node blue"/><text x="165" y="260" text-anchor="middle" class="label">固定操作</text><text x="165" y="291" text-anchor="middle" class="small">key + 最终参数</text>
  <rect x="365" y="170" width="235" height="105" rx="16" class="node"/><text x="482" y="212" text-anchor="middle" class="label">首次请求</text><text x="482" y="242" text-anchor="middle" class="small">create-incident-42</text>
  <rect x="365" y="390" width="235" height="105" rx="16" class="node amber"/><text x="482" y="432" text-anchor="middle" class="label">重试请求</text><text x="482" y="462" text-anchor="middle" class="small">仍使用同一 key</text>
  <rect x="700" y="260" width="240" height="145" rx="18" class="node blue"/><text x="820" y="302" text-anchor="middle" class="label">服务端原子记录</text><text x="820" y="335" text-anchor="middle" class="small">键 + 参数摘要</text><text x="820" y="365" text-anchor="middle" class="small">工单号 + 返回结果</text>
  <rect x="1000" y="170" width="155" height="105" rx="16" class="node green"/><text x="1077" y="212" text-anchor="middle" class="label">创建一次</text><text x="1077" y="242" text-anchor="middle" class="small">工单 #A42</text>
  <rect x="1000" y="390" width="155" height="105" rx="16" class="node green"/><text x="1077" y="432" text-anchor="middle" class="label">返回原结果</text><text x="1077" y="462" text-anchor="middle" class="small">不再创建</text>
  <path d="M275 260L360 222" class="line"/><path d="M275 290L360 440" class="line"/><path d="M600 222L695 300" class="line"/><path d="M600 440L695 365" class="line"/><path d="M940 290L995 222" class="line"/><path d="M940 375L995 440" class="line"/>
  <text x="612" y="185" class="small">首次</text><text x="612" y="507" class="small">响应丢失后</text>
  <rect x="55" y="570" width="1100" height="112" rx="18" fill="#edf2f7" stroke="#d5dee8"/><text x="85" y="612" class="label">键要稳定且参数一致</text><text x="85" y="647" class="small">每次尝试换键会创建新操作；同键换参数应报冲突。预算耗尽或结果不可查时，转入人工核对。</text>
</svg>
