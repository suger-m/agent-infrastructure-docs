<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">DAG依赖如何让产物流向审阅</title><desc id="desc">调研产物分叉供配置修改与检查清单使用；两者汇合形成固定候审版本，再由审阅者检查。若需返工，图将下一轮任务展开为新的有向无环图，不在同一张DAG中画回路。</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#526579"/></marker></defs><rect width="1200" height="760" fill="#f5f8fc"/>
  <style>.title{font:700 28px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#14283f}.label{font:600 19px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#18324d}.small{font:17px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#526579}.node{fill:#fff;stroke:#9db0c4;stroke-width:2}.blue{fill:#e7f1ff;stroke:#5b8cc9}.green{fill:#e6f5ee;stroke:#4c9b72}.amber{fill:#fff2d9;stroke:#c58a2b}.line{fill:none;stroke:#526579;stroke-width:2.5;marker-end:url(#arrow)}.dash{fill:none;stroke:#c58a2b;stroke-width:2.5;stroke-dasharray:8 7;marker-end:url(#arrow)}</style>
  <text x="48" y="58" class="title">依赖边传递产物，汇合前检查每个前提</text><text x="50" y="104" class="small">通用 DAG 教学图 · 不代表 Pi 内置声明式工作流接口</text>
  <rect x="55" y="290" width="190" height="100" rx="16" class="node blue"/><text x="150" y="330" text-anchor="middle" class="label">调研规则</text><text x="150" y="360" text-anchor="middle" class="small">字段与约束</text>
  <rect x="345" y="170" width="205" height="100" rx="16" class="node"/><text x="447" y="210" text-anchor="middle" class="label">修改配置</text><text x="447" y="240" text-anchor="middle" class="small">产物：补丁 v1</text>
  <rect x="345" y="430" width="205" height="100" rx="16" class="node"/><text x="447" y="470" text-anchor="middle" class="label">准备清单</text><text x="447" y="500" text-anchor="middle" class="small">产物：检查项</text>
  <rect x="645" y="290" width="220" height="100" rx="16" class="node amber"/><text x="755" y="330" text-anchor="middle" class="label">固定候审版本</text><text x="755" y="360" text-anchor="middle" class="small">补丁 v1 + 清单</text>
  <rect x="950" y="290" width="190" height="100" rx="16" class="node green"/><text x="1045" y="330" text-anchor="middle" class="label">Reviewer</text><text x="1045" y="360" text-anchor="middle" class="small">结论绑定 v1</text>
  <rect x="645" y="520" width="220" height="90" rx="16" class="node blue"/><text x="755" y="557" text-anchor="middle" class="label">新一轮：修复 v2</text><text x="755" y="585" text-anchor="middle" class="small">重新固定候审产物</text>
  <rect x="950" y="520" width="190" height="90" rx="16" class="node green"/><text x="1045" y="557" text-anchor="middle" class="label">Reviewer v2</text><text x="1045" y="585" text-anchor="middle" class="small">结论绑定 v2</text>
  <path d="M245 320L340 220" class="line"/><path d="M245 350L340 480" class="line"/><path d="M550 220L640 310" class="line"/><path d="M550 480L640 360" class="line"/><path d="M865 340H945" class="line"/><path d="M1045 395V455H755V515" class="dash"/><path d="M865 565H945" class="line"/>
  <text x="805" y="440" class="small">需要返工：展开下一轮</text><rect x="55" y="635" width="1085" height="54" rx="14" fill="#edf2f7"/><text x="78" y="670" class="small">任一前提失败：依赖节点保持阻塞，不把“结束”当作“成功”</text>
</svg>
