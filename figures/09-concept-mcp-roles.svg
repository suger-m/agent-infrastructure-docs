<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">MCP 宿主、客户端与服务端及两种传输</title><desc id="desc">宿主控制模型可见定义和授权，并持有 MCP 客户端。客户端通过本机 stdio 子进程或远端 HTTP 与 MCP 服务端握手、发现工具并调用。</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#526579"/></marker></defs><rect width="1200" height="680" fill="#f5f8fc"/>
  <style>.title{font:700 28px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#14283f}.label{font:600 19px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#18324d}.small{font:17px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#526579}.node{fill:#fff;stroke:#9db0c4;stroke-width:2}.blue{fill:#e7f1ff;stroke:#5b8cc9}.green{fill:#e6f5ee;stroke:#4c9b72}.amber{fill:#fff2d9;stroke:#c58a2b}.line{fill:none;stroke:#526579;stroke-width:2.5;marker-end:url(#arrow)}.back{fill:none;stroke:#7390aa;stroke-width:2.5;stroke-dasharray:7 6;marker-end:url(#arrow)}</style>
  <text x="48" y="58" class="title">MCP 分开宿主决策、客户端协议和服务端业务</text><text x="50" y="98" class="small">通用教学模型 · 传输方式不授予权限，也不自动隔离服务进程</text>
  <rect x="55" y="175" width="260" height="150" rx="18" class="node blue"/><text x="185" y="216" text-anchor="middle" class="label">Agent 宿主</text><text x="185" y="248" text-anchor="middle" class="small">模型可见定义、授权与执行</text><text x="185" y="278" text-anchor="middle" class="small">把结果放回会话</text>
  <rect x="455" y="175" width="260" height="150" rx="18" class="node green"/><text x="585" y="216" text-anchor="middle" class="label">MCP client</text><text x="585" y="248" text-anchor="middle" class="small">握手、发现、调用与关联响应</text><text x="585" y="278" text-anchor="middle" class="small">由宿主持有连接状态</text>
  <rect x="855" y="175" width="290" height="150" rx="18" class="node blue"/><text x="1000" y="216" text-anchor="middle" class="label">MCP server</text><text x="1000" y="248" text-anchor="middle" class="small">公布工具并处理协议请求</text><text x="1000" y="278" text-anchor="middle" class="small">接入自己的业务资源</text>
  <path d="M315 230H450" class="line"/><text x="382" y="212" text-anchor="middle" class="small">宿主策略</text><path d="M455 290H320" class="back"/><text x="386" y="318" text-anchor="middle" class="small">定义 / 结果</text>
  <path d="M715 230H850" class="line"/><text x="782" y="212" text-anchor="middle" class="small">协议消息</text><path d="M855 290H720" class="back"/><text x="785" y="318" text-anchor="middle" class="small">响应按 ID</text>
  <rect x="115" y="430" width="400" height="140" rx="18" class="node amber"/><text x="315" y="470" text-anchor="middle" class="label">本机通道：stdio</text><text x="315" y="502" text-anchor="middle" class="small">宿主启动子进程；stdin / stdout 传协议</text><text x="315" y="532" text-anchor="middle" class="small">stderr 用于诊断</text>
  <rect x="685" y="430" width="400" height="140" rx="18" class="node amber"/><text x="885" y="470" text-anchor="middle" class="label">远端通道：HTTP</text><text x="885" y="502" text-anchor="middle" class="small">服务通常独立运行；消息经网络送达</text><text x="885" y="532" text-anchor="middle" class="small">关闭连接不代表宿主管理远端进程</text>
  <path d="M585 325V375H315V425" class="line"/><path d="M585 325V375H885V425" class="line"/>
  <rect x="55" y="605" width="1090" height="48" rx="14" fill="#edf2f7" stroke="#d5dee8"/><text x="600" y="636" text-anchor="middle" class="small">初始化与版本协商之后仍需发现工具；协议顺序、参数 schema 与操作授权是不同检查。</text>
</svg>
